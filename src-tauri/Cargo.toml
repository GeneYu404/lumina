[package]
name = "lumina"
version = "1.0.0"
description = "拾光 Lumina - Windows image and video viewer"
edition = "2021"
rust-version = "1.79"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
rayon = "1.10"
# EXIF orientation: phone photos carry an Orientation tag the raw decoder ignores.
# Reading it here lets us report the *visual* dimensions so the page never
# has to guess whether the asset is portrait or landscape.
kamadak-exif = "0.5"
# Per-user registration (right-click menu / default apps) + wallpaper style.
winreg = "0.56"
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
